services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: books
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: books
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U books -d books"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://books:${POSTGRES_PASSWORD}@db:5432/books
      STORAGE_DIR: /app/storage
      NODE_ENV: production
    volumes:
      - book_images:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  book_images:
